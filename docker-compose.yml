# Compose v2+: the top-level `version` key is obsolete and ignored.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      # Restrict CORS to the local UI by default. Override at deploy time.
      - POKER_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - POKER_SESSIONS_DIR=/app/data/sessions
      # 10 MiB per frame, 16 frames per sequence.
      - POKER_MAX_IMAGE_BYTES=10485760
      - POKER_MAX_SEQUENCE_LEN=16
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
